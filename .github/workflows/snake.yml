name: Generate Snake

# Trigger the workflow on push to the main branch
on:
  push:
    branches:
      - main
  # Allows you to run the workflow manually
  workflow_dispatch:

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Generate the Snake animation
      - name: Generate Snake animation
        uses: Platane/snk@v2
        with:
          github_user_name: Thuan3101  # Replace with your GitHub username
          outputs: dist

      # Commit and push the generated animation to the output branch
      - name: Push Snake animation
        run: |
          mkdir -p output
          mv dist/github-contribution-grid-snake.svg output/
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/github-contribution-grid-snake.svg
          git commit -m "Generated Snake animation"
          git push
